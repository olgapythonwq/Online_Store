{% extends 'catalog/base.html' %}

<head>
    <title>{% block title %}Contacts{% endblock %}</title>
</head>

<body>
    {% block content %}
    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Contacts</h1>
    </div>

    <div class="container">
        <div class="row text-start">
            <div class="col-lg-9 col-md-6 col-sm-12">
                <div class="card mb-4 box-shadow">
                    <div class="card-body">
                        <table class="table table-striped">
                            <tr>
                                <td class="w-25">Country</td>
                                <td>USA</td>
                            </tr>
                            <tr>
                                <td class="w-25">SSN</td>
                                <td>91-1144442</td>
                            </tr>
                            <tr>
                                <td class="w-25">Adress</td>
                                <td>Redmond,WA,98052-6399</td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="card mb-4 box-shadow">
                    <div class="card-header">
                        <h4 class="my-0 font-weight-normal">Contact us</h4>
                    </div>
                    <div class="card-body">
                        <form method="post" action="" class="form-floating">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="name">Name</label>
                                <input type="text" name="name" class="form-control" id="name" placeholder="Your name" required>
                            </div>
                            <div class="mb-3">
                                <label for="phone">Phone</label>
                                <input type="text" name="phone" class="form-control" id="phone" placeholder="Your phone" required>
                            </div>
                            <div class="mb-3">
                                <label for="message">Message</label>
                                <textarea type="text" name="message" class="form-control" id="message" placeholder="Your message" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Send</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    {% endblock %}
